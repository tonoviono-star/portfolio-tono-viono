<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10100f" />
    <meta name="description" content="Portfolio Tono Viono sedang dimuat." />
    <title>Tono Viono — Loading</title>
    <link rel="stylesheet" href="./loading.css" />
    <script src="./loading.js" defer></script>
  </head>
  <body>
    <main class="loading-screen" aria-label="Memuat portfolio Tono Viono">
      <div class="glow" aria-hidden="true"></div>

      <section class="loading-content">
        <p class="eyebrow">PORTFOLIO <span>·</span> PERSONAL WEBSITE</p>

        <div class="board" aria-label="TONO VIONO">
          <div class="split-flap" id="split-flap" aria-hidden="true"></div>
          <span class="sr-only">TONO VIONO</span>
        </div>

        <div class="loading-status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span>MEMUAT PORTFOLIO</span>
          <span class="status-rule" aria-hidden="true"></span>
          <span class="status-note">PLEASE WAIT</span>
        </div>
      </section>

      <p class="footer">DESIGN <span>·</span> DEVELOPMENT <span>·</span> CREATIVE</p>
    </main>
  </body>
</html>
